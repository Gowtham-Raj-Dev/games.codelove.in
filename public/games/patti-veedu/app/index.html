/* Layout: landscape phone. Thumbs own the two bottom corners (move left, act right); status lives on the top edge. */
:root{
  --night:#0a0809; --soot:#17120f;
  --panel:linear-gradient(165deg,rgba(32,11,10,.95),rgba(11,5,5,.96) 60%);
  --lamp:#d23a2c; --lamp-hi:#ff8270; --lamp-dim:rgba(210,58,44,.35); --kumkum:#d0362a; --paper:#efe4cb; --ash:#a89f91; --leaf:#46d39a;
  --line:rgba(200,44,34,.28); --line-soft:rgba(200,44,34,.14); --glass:rgba(14,11,10,.62);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,140,120,.06);
  --ease:cubic-bezier(.2,.8,.25,1); --spring:cubic-bezier(.2,1.3,.35,1);
  --f-display:"Creepster","Catamaran","Noto Sans Tamil",serif;
  --f-body:"Special Elite","Hind Madurai","Noto Sans Tamil",system-ui,sans-serif;
  --blood:#b3120c; --blood-hi:#e2261a; --blood-deep:#3d0503; --bone:#eadfcb;
  --f-hand:"Kavivanar","Noto Sans Tamil",cursive;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
html[data-lang="ta"]{font-size:14px}
@media (max-height:400px){html{font-size:14px}html[data-lang="ta"]{font-size:13px}}
@media (max-height:340px){html{font-size:13px}html[data-lang="ta"]{font-size:12px}}
html,body{height:100%;margin:0;background:var(--night);color:var(--paper);overflow:hidden;font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
svg{display:block}
svg.gi{display:block}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 45%,#1d1410 0%,var(--night) 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;transition:opacity .6s}
#splash .t{font-family:var(--f-display);font-weight:900;font-size:clamp(2.4rem,13vh,4.6rem);line-height:1.15;white-space:nowrap;background:linear-gradient(180deg,#ff4a33 0%,var(--blood) 45%,#4a0503 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(200,15,5,.45))}
#splash .s{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
#splash .bar{width:min(16rem,60vw);height:4px;background:rgba(200,44,34,.12);border-radius:4px;overflow:hidden;margin-top:.5rem}
#splash .bar i{display:block;height:100%;background:linear-gradient(90deg,#5a0805,var(--lamp-hi));transform-origin:left;transform:scaleX(0);transition:transform .25s;border-radius:4px}
#splashTip{margin-top:.9rem;max-width:min(26rem,80vw);text-align:center;font-size:.82rem;color:var(--ash);line-height:1.45;min-height:2.4em;transition:opacity .4s}
.flame{width:14px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff6d8 0 18%,#ffcf6a 30%,#ff8a1f 60%,transparent 72%);animation:flick 1.1s infinite alternate;filter:drop-shadow(0 0 10px rgba(255,160,60,.7))}
@keyframes flick{0%{transform:scale(1,1) translateY(0)}50%{transform:scale(.9,1.12) translateY(-1px)}100%{transform:scale(1.05,.94)}}

/* ---------- rotate prompt ---------- */
#rotate{position:fixed;inset:0;z-index:70;background:var(--night);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:24px}
@media (orientation:portrait){#rotate{display:flex}}
#rotate .ph{width:46px;height:78px;border:3px solid var(--lamp);border-radius:10px;animation:rot 2s infinite ease-in-out}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotBtn{width:auto;min-height:46px;margin-top:.4rem;padding:.4rem 1.1rem .4rem .7rem;font-size:1rem}
#rotBtn svg{fill:none;stroke:#f6e6d0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px}
/* full screen and tips (js/screen.js) */
.sysBtns{position:absolute;top:calc(10px + var(--st));right:calc(12px + var(--sr));z-index:3;display:flex;gap:8px}
.rbtn svg.st{fill:none;stroke:var(--paper);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tipSheet{z-index:80}
#tipSheet .panel{max-width:min(21rem,92vw);text-align:center;padding:1.1rem 1.2rem}
#tipSheet h2{margin:0 0 .5rem}
#tipSheet p{margin:0 0 1rem;line-height:1.5;font-size:.88rem;color:var(--paper)}
#tipSheet .plate{justify-content:center;min-height:44px;padding:.4rem 1rem}

/* ---------- buttons ---------- */
.plate{appearance:none;display:flex;align-items:center;gap:.75rem;width:100%;min-height:50px;padding:.45rem 1rem .45rem .5rem;border:1px solid var(--line);background:linear-gradient(180deg,rgba(44,14,12,.62),rgba(14,6,6,.86));color:var(--paper);font-size:.95rem;text-align:left;cursor:pointer;border-radius:var(--r-md);position:relative;overflow:hidden;transition:transform .12s var(--ease),border-color .2s,background .2s,box-shadow .2s;box-shadow:inset 0 1px 0 rgba(255,220,160,.08)}
.plate > span[data-icon]{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(200,44,34,.1);border:1px solid var(--line-soft)}
.plate svg{width:20px;height:20px;flex:none;fill:var(--lamp)}
.plate:active{transform:scale(.97);border-color:var(--lamp);background:linear-gradient(180deg,rgba(80,16,12,.8),rgba(22,7,6,.9))}
.plate:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.plate.primary{font-family:var(--f-display);font-weight:800;font-size:1.2rem;min-height:56px;background:linear-gradient(180deg,#a3170e,#5c0906 70%,#360403);color:#f6e6d0;border-color:#e0433a;box-shadow:0 8px 24px rgba(200,20,10,.3),inset 0 1px 0 rgba(255,240,200,.55)}
.plate.primary > span[data-icon]{background:rgba(31,19,7,.16);border-color:rgba(31,19,7,.25)}
.plate.primary svg{fill:#f6e6d0}
.plate.primary::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,248,225,.45),transparent);transform:translateX(-140%) skewX(-18deg);animation:sheen 4.2s 1.2s infinite var(--ease);pointer-events:none;will-change:transform}
@keyframes sheen{0%{transform:translateX(-140%) skewX(-18deg)}28%,100%{transform:translateX(440%) skewX(-18deg)}}
.plate.ghost{background:transparent;min-height:42px;font-size:.86rem;box-shadow:none;border-color:var(--line-soft)}
.plate.ghost > span[data-icon]{width:30px;height:30px;background:transparent;border:0}
.seg{display:flex;gap:3px;padding:3px;background:rgba(8,6,6,.55);border:1px solid var(--line-soft);border-radius:999px}
.seg button{flex:1;min-height:36px;background:transparent;border:0;color:var(--ash);font-size:.8rem;white-space:nowrap;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#b3221a,#6a0b07);color:#f6e6d0;font-weight:600;box-shadow:0 2px 10px rgba(200,44,34,.3)}
.label{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--lamp),rgba(200,44,34,.18))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7.5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9a86,#8e140d 70%);border:1px solid #e0433a;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(200,44,34,.25)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#a3170e;border:1px solid #e0433a}
.srow{display:flex;flex-direction:column;gap:.15rem}
.srow .lab{display:flex;align-items:center;gap:.4rem}
.srow .lab svg{width:14px;height:14px;fill:var(--ash)}

/* ---------- title screen ---------- */
#menu{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(16rem,22rem);gap:clamp(1rem,4vw,3rem);align-items:center;padding:calc(14px + var(--st)) calc(20px + var(--sr)) calc(14px + var(--sb)) calc(28px + var(--sl));background:linear-gradient(90deg,rgba(10,8,9,.9) 0%,rgba(10,8,9,.3) 52%,rgba(10,8,9,.82) 100%),radial-gradient(ellipse at 20% 50%,rgba(200,44,34,.06),transparent 60%)}
.brand{display:flex;flex-direction:column;gap:.3rem;min-width:0;animation:rise .9s var(--ease) both}
.eyebrow{display:flex;align-items:center;gap:.6rem;font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--lamp)}
.eyebrow::before{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--lamp))}
.title-ta{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,12.5vh,4.4rem);line-height:1.2;margin:0;white-space:nowrap;background:linear-gradient(180deg,#fff5dc 15%,#f2c070 60%,#c98531 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(200,44,34,.3)) drop-shadow(0 4px 2px rgba(0,0,0,.6))}
.title-en{font-family:var(--f-display);font-weight:500;letter-spacing:.45em;font-size:.72rem;color:var(--ash);white-space:nowrap}
html[data-lang="en"] .title-en{letter-spacing:.06em;font-size:.82rem}
.bells{width:min(19rem,70%);height:30px;margin:.15rem 0 .1rem;overflow:visible}
.bells path{fill:none;stroke:var(--lamp);stroke-width:1.4;opacity:.7}
.bells .b{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.6s ease-in-out infinite alternate}
.bells .b circle{fill:url(#bellG)}
.bells .b:nth-child(odd){animation-delay:-1.3s}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.tag{margin:.3rem 0 0;max-width:24rem;line-height:1.5;color:var(--ash);font-size:.82rem}
.best{align-self:flex-start;font-size:.78rem;color:var(--lamp);font-variant-numeric:tabular-nums;margin-top:.45rem;padding:.25rem .7rem;border:1px solid var(--line-soft);border-radius:999px;background:rgba(200,44,34,.06)}
.best:empty{display:none}
.side{display:flex;flex-direction:column;gap:.5rem;max-height:100%;overflow-y:auto;padding:2px}
#menuMain{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:.9rem;box-shadow:var(--shadow);animation:rise .9s .12s var(--ease) both;gap:.55rem}
.side .row{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.15rem}
.panel{background:var(--panel);border:1px solid var(--line);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.7rem;max-height:calc(100vh - 28px);overflow-y:auto;border-radius:var(--r-lg);box-shadow:var(--shadow);animation:pop .32s var(--spring) both}
.panel h2{font-family:var(--f-display);font-weight:800;margin:0;font-size:1.15rem;color:var(--lamp-hi);display:flex;align-items:center;gap:.5rem}
.panel h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.howgrid{display:grid;grid-template-columns:auto 1fr;gap:.45rem .75rem;align-items:center;font-size:.8rem;line-height:1.4}
.howgrid .ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(200,44,34,.08);display:grid;place-items:center;color:var(--lamp)}
.howgrid .ic svg{width:20px;height:20px;fill:var(--lamp)}
.howgrid .ic.g{border-color:rgba(70,211,154,.45);background:rgba(70,211,154,.1)}
.howgrid .ic.g svg{fill:var(--leaf)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#touchLayer{position:fixed;inset:0;z-index:4;touch-action:none}
.topbar{position:absolute;top:calc(8px + var(--st));left:calc(12px + var(--sl));right:calc(12px + var(--sr));display:flex;justify-content:space-between;align-items:flex-start}
.hudL{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:40vw}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.nightpill{display:flex;align-items:center;gap:.6rem;background:var(--glass);border:1px solid var(--line-soft);padding:.32rem .75rem .32rem .65rem;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#nightLbl{font-family:var(--f-display);font-weight:800;font-size:.92rem;white-space:nowrap;color:var(--paper);line-height:1}
#nightLbl small{font-family:var(--f-body);font-weight:400;color:var(--ash);font-size:.7rem;margin-left:.25rem}
.lives svg.lv{width:15px;height:15px;fill:var(--lamp);filter:drop-shadow(0 0 4px rgba(200,44,34,.7))}
.lives svg.lv.out{fill:rgba(165,156,142,.3);filter:none}
.chip{display:flex;align-items:center;gap:.4rem;background:var(--glass);border:1px solid var(--line-soft);padding:.22rem .65rem .22rem .45rem;border-radius:999px;font-size:.68rem;color:var(--paper);line-height:1.2;white-space:nowrap}
.chip svg{width:15px;height:15px;fill:var(--lamp);flex:none}
#koChip{border-color:rgba(70,211,154,.5);background:rgba(10,40,28,.6);color:#bff5dd}
#koChip svg{fill:var(--leaf)}
@keyframes koPulse{50%{box-shadow:0 0 0 4px rgba(70,211,154,.12)}}
#objChip{pointer-events:auto;cursor:pointer;text-align:left;font:inherit;white-space:normal;display:flex;align-items:flex-start;gap:.5rem;background:var(--glass);border:1px solid var(--line-soft);border-left:3px solid var(--lamp);padding:.35rem .7rem .35rem .5rem;border-radius:var(--r-sm);max-width:min(calc(30vw - 24px),19rem);box-shadow:0 4px 14px rgba(0,0,0,.3);transition:border-color .3s}
#objChip svg{width:16px;height:16px;fill:var(--lamp);flex:none;margin-top:.12rem}
#objChip .ot{display:flex;flex-direction:column;gap:.05rem;min-width:0}
#objChip .ot small{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lamp)}
#objText{font-size:.7rem;line-height:1.35;color:var(--paper);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#objText em{color:var(--lamp);font-style:normal}
#objChip.flash{animation:objFlash 1.4s var(--ease)}
@keyframes objFlash{0%{transform:translateX(-6px);opacity:.2;border-color:var(--lamp-hi)}25%{transform:none;opacity:1;box-shadow:0 0 0 3px rgba(200,44,34,.25),0 4px 14px rgba(0,0,0,.3)}100%{box-shadow:0 4px 14px rgba(0,0,0,.3)}}
#objChip:active{transform:scale(.97)}
.tbtns{display:flex;gap:8px;pointer-events:auto;align-items:center}
.tbtns .chip{margin-right:2px;pointer-events:none}
.rbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;color:var(--paper);cursor:pointer;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:transform .12s,background .15s}
.rbtn svg{width:22px;height:22px;fill:var(--paper)}
html:not(.desk) .rbtn{width:34px;height:34px}html:not(.desk) .rbtn svg{width:17px;height:17px} /* phones: small corner buttons */
.rbtn:active,.rbtn.down{background:rgba(200,44,34,.25);transform:scale(.92)}
#roomLbl{position:absolute;top:calc(12px + var(--st));left:50%;transform:translate(-50%,-6px);font-family:var(--f-display);font-weight:500;font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--paper);opacity:0;transition:opacity .6s,transform .6s var(--ease);white-space:nowrap;text-shadow:0 1px 6px #000;display:flex;align-items:center;gap:.6rem}
#roomLbl::before,#roomLbl::after{content:"";width:22px;height:1px;background:var(--lamp)}
#roomLbl.show{opacity:.92;transform:translate(-50%,0)}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(239,228,203,.5);transition:transform .15s var(--spring),background .15s}
#cross.on{transform:scale(2);background:var(--lamp);box-shadow:0 0 10px rgba(200,44,34,.8)}
#prompt{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);font-size:.82rem;text-align:center;color:var(--paper);text-shadow:0 1px 3px #000,0 0 12px #000;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
#prompt b{display:none}
#prompt b.stab{display:inline-block;color:#b8ffe0;font-weight:600;font-size:.92rem;text-shadow:0 0 12px rgba(70,211,154,.8),0 1px 3px #000;animation:stabBlink .8s ease-in-out infinite alternate}
@keyframes stabBlink{from{opacity:.65}to{opacity:1}}
#prompt .no{color:var(--ash)}
#toast{position:absolute;left:50%;top:calc(54px + var(--st));transform:translate(-50%,-10px);max-width:min(28rem,40vw);text-align:center;font-size:.8rem;line-height:1.45;color:var(--paper);background:linear-gradient(180deg,rgba(26,19,14,.9),rgba(12,9,8,.86));border:1px solid var(--line);border-top:2px solid var(--lamp);padding:.5rem 1rem;border-radius:var(--r-md);opacity:0;transition:opacity .35s,transform .45s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Paatti's voice, heard somewhere in the house */
#voiceSub{position:absolute;left:50%;bottom:calc(26% + var(--sb));transform:translateX(-50%);max-width:min(30rem,62vw);text-align:center;font-family:var(--f-body);font-style:italic;font-size:.88rem;line-height:1.4;color:rgba(232,206,198,.9);text-shadow:0 0 10px #000,0 0 3px #000,0 0 1px #000;opacity:0;transition:opacity .9s;pointer-events:none;letter-spacing:.04em}
#voiceSub.on{opacity:1}
#voiceSub::before,#voiceSub::after{content:'"';color:var(--blood-hi)}
#toast em{color:var(--lamp-hi);font-style:normal;font-weight:600}
#toast .bad{color:#ff7a66;font-weight:600}
#stam{position:absolute;left:50%;bottom:calc(84px + var(--sb));width:130px;height:4px;margin-left:-65px;background:rgba(239,228,203,.14);opacity:0;transition:opacity .4s;border-radius:4px;overflow:hidden}
#stam.show{opacity:1}
#stam i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c98531,var(--paper));transform-origin:left;border-radius:4px}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.68) 100%)}
#danger{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(194,43,31,.55) 100%);opacity:0;transition:opacity .3s}
#hideMask{position:absolute;inset:0;opacity:0;transition:opacity .35s;background:linear-gradient(180deg,#000 0%,#000 26%,transparent 36%,transparent 64%,#000 74%,#000 100%)}
#hideMask.hay{background:repeating-linear-gradient(103deg,rgba(52,36,10,.97) 0 5px,rgba(126,92,34,.92) 5px 7px,rgba(38,26,8,.98) 7px 13px,rgba(96,70,24,.9) 13px 15px);-webkit-mask-image:radial-gradient(ellipse 36% 25% at 50% 52%,transparent 55%,#000 100%);mask-image:radial-gradient(ellipse 36% 25% at 50% 52%,transparent 55%,#000 100%)}
#hideMask.show{opacity:1}
#hideMask.cot{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 22%,transparent 82%,rgba(0,0,0,.7) 100%),radial-gradient(ellipse 85% 75% at 50% 55%,transparent 55%,rgba(0,0,0,.7) 100%)}
#hideMask.slats{background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 45%,rgba(0,0,0,.78) 100%)}
body.hiding #joy,body.hiding #joyHint,body.hiding #btnTorch,body.hiding #btnCrouch,body.hiding #btnDrop,body.hiding .slot,body.hiding #objChip,body.hiding #prompt,body.hiding #cross,body.hiding #stam{opacity:0!important;pointer-events:none!important;transition:opacity .3s}
#hideTxt{display:flex;align-items:center;gap:.5rem;flex-direction:column}
#hideTxt b{display:flex;align-items:center;gap:.45rem;font-weight:600;font-size:.8rem;letter-spacing:.12em;color:var(--paper);background:var(--glass);border:1px solid var(--line-soft);padding:.3rem .8rem .3rem .55rem;border-radius:999px}
#hideTxt b svg{width:16px;height:16px;fill:var(--lamp)}
#hideTxt small{font-size:.66rem;letter-spacing:.04em;color:var(--ash);text-transform:none}
#hideTxt{position:absolute;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);opacity:0;transition:opacity .35s}
#hideTxt.show{opacity:1}
#keysHint{display:none}

/* joystick */
#joy{position:absolute;left:calc(40px + var(--sl));bottom:calc(30px + var(--sb));width:124px;height:124px;opacity:.5;transition:opacity .25s}
#joy.on{opacity:1;transition:none}
#joy .base{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(200,44,34,.4);background:radial-gradient(circle,rgba(200,44,34,.07),rgba(12,10,9,.4) 70%);box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
#joy .base::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px dashed rgba(200,44,34,.22)}
#joy.running .base{border-color:rgba(255,143,107,.7)}
#joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd88e,#5a0805 72%);box-shadow:0 3px 12px rgba(0,0,0,.6),0 0 16px rgba(200,44,34,.35),inset 0 1px 0 rgba(255,245,215,.6)}
#joy .run{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:.6rem;letter-spacing:.2em;color:#ff8f6b;opacity:0;transition:opacity .15s}
#joy.running .run{opacity:1}
#joyHint{position:absolute;left:calc(40px + var(--sl));bottom:calc(160px + var(--sb));font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);display:flex;align-items:center;gap:.35rem}
#joyHint svg{width:14px;height:14px;fill:var(--ash)}

/* action cluster */
.acts{position:absolute;right:calc(24px + var(--sr));bottom:calc(22px + var(--sb));width:200px;height:190px;pointer-events:none}
.abtn{position:absolute;border-radius:50%;display:grid;place-items:center;pointer-events:auto;cursor:pointer;padding:0;border:1px solid rgba(200,44,34,.32);background:var(--glass);color:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s var(--ease),background .15s,border-color .15s}
.abtn svg{width:26px;height:26px;fill:currentColor}
.abtn small{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);white-space:nowrap;text-shadow:0 1px 3px #000}
.abtn[aria-pressed="true"]{background:rgba(200,44,34,.26);border-color:var(--lamp);color:var(--lamp-hi)}
.abtn:active,.abtn.down,#btnAct.down{transform:scale(.92)}
#btnAct{right:0;bottom:6px;width:90px;height:90px;border:2px solid rgba(200,44,34,.32);background:radial-gradient(circle at 50% 38%,rgba(70,50,28,.8),rgba(12,10,9,.74));transition:border-color .2s,box-shadow .25s,transform .12s var(--ease);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#actIcon{display:grid;place-items:center;width:38px;height:38px;flex:none}
#btnAct svg{width:34px;height:34px;opacity:.38;fill:var(--paper);transition:opacity .2s,transform .25s var(--spring)}
#actLbl{display:block;max-width:74px;font-size:.6rem;font-weight:600;line-height:1.15;letter-spacing:.06em;text-transform:uppercase;color:var(--ash);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#actLbl:empty{display:none}
#btnAct.ready{border-color:var(--lamp);box-shadow:0 0 0 4px rgba(200,44,34,.12),0 0 24px rgba(200,44,34,.35)}
#btnAct.ready svg{opacity:1;fill:var(--lamp-hi);transform:scale(1.06)}
#btnAct.ready #actLbl{color:var(--paper)}
#btnAct.hot{border-color:var(--leaf);background:radial-gradient(circle at 50% 38%,rgba(24,90,62,.85),rgba(8,24,18,.8));box-shadow:0 0 22px rgba(70,211,154,.45)}
#btnAct.hot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid rgba(70,211,154,.6);animation:hotRing 1s ease-out infinite;pointer-events:none;will-change:transform,opacity}
#btnAct.hot svg{fill:#b6ffe0}
#btnAct.hot #actLbl{color:#d8ffee}
@keyframes hotRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.35);opacity:0}}
#btnCrouch{right:106px;bottom:0;width:56px;height:56px}
#btnTorch{right:94px;bottom:76px;width:52px;height:52px}
#btnDrop{right:22px;bottom:114px;width:50px;height:50px}

/* held item slot */
